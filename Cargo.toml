[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.5.0"
license = "MIT"
edition = "2024"
repository = "https://github.com/lizarbe513/Lizarbe-Ajustes"

[workspace.dependencies]
lizarbe-core = { path = "crates/core" }
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
libc = "0.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
toml_edit = "0.25.15"
unicode-width = "0.2.2"
tempfile = "3.27.0"

# Las imágenes se decodifican y reducen mucho más rápido optimizadas (y las pruebas con ellas también).
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
